version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neura_postgres
    environment:
      POSTGRES_DB: neura_db
      POSTGRES_USER: neura
      POSTGRES_PASSWORD: neura_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neura"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neura_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://neura:neura_password@postgres:5432/neura_db
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
